<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Undangan</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f1a14;
            --bg-card: #16261d;
            --gold-primary: #d4af37;
            --gold-light: #f5e5b8;
            --text-light: #f8f5ee;
            --text-muted: #a3b0a7;
            --font-title: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .generator-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .title {
            font-family: var(--font-title);
            color: var(--gold-primary);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--gold-light);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 26, 20, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--text-light);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.9rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold-primary);
        }

        .btn-generate {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--gold-primary), #997a15);
            color: #121a15;
            border: none;
            border-radius: 30px;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .result-box {
            margin-top: 25px;
            display: none;
            background: rgba(15, 26, 20, 0.6);
            border: 1px dashed rgba(212, 175, 55, 0.4);
            padding: 15px;
            border-radius: 8px;
        }

        .result-box.active {
            display: block;
        }

        .result-title {
            font-size: 0.8rem;
            color: var(--gold-light);
            margin-bottom: 8px;
        }

        .link-output {
            word-break: break-all;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid var(--gold-primary);
            background: transparent;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
            text-decoration: none;
        }

        .btn-action:hover {
            background: var(--gold-primary);
            color: #121a15;
        }
    </style>
</head>
<body>

    <div class="generator-card">
        <h1 class="title">Generator Link Undangan</h1>
        <p class="subtitle">Buat link khusus nama tamu secara otomatis</p>

        <form id="linkForm">
            <div class="form-group">
                <label for="domainInput">URL Website Undangan</label>
                <input type="text" id="domainInput" class="form-control" placeholder="https://domainkamu.com/index.html" required>
            </div>

            <div class="form-group">
                <label for="guestInput">Nama Tamu Undangan</label>
                <input type="text" id="guestInput" class="form-control" placeholder="Contoh: Kang Agus & Partner" required>
            </div>

            <button type="submit" class="btn-generate">
                <i class="fas fa-link"></i> Buat Link
            </button>
        </form>

        <div class="result-box" id="resultBox">
            <div class="result-title">Link Undangan Siap Kirim:</div>
            <div class="link-output" id="linkOutput"></div>
            
            <div class="action-buttons">
                <button class="btn-action" onclick="copyLink()">
                    <i class="far fa-copy"></i> Salin Link
                </button>
                <a href="#" id="waBtn" target="_blank" class="btn-action">
                    <i class="fab fa-whatsapp"></i> Share WA
                </a>
            </div>
        </div>
    </div>

    <script>
        // Set otomatis domain default dari lokasi file dibuka
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.href.replace('generator.html', 'index.html');
            document.getElementById('domainInput').value = currentPath;
        });

        const linkForm = document.getElementById('linkForm');
        const resultBox = document.getElementById('resultBox');
        const linkOutput = document.getElementById('linkOutput');
        const waBtn = document.getElementById('waBtn');

        linkForm.addEventListener('submit', function(e) {
            e.preventDefault();

            let domain = document.getElementById('domainInput').value.trim();
            const guest = document.getElementById('guestInput').value.trim();

            if (!domain.endsWith('index.html') && !domain.endsWith('/')) {
                domain += '/';
            }

            // Encode nama tamu untuk URL
            const generatedUrl = `${domain}?to=${encodeURIComponent(guest)}`;

            // Tampilkan hasil
            linkOutput.innerText = generatedUrl;
            resultBox.classList.add('active');

            // Set pesan WhatsApp
            const waMessage = `Sampurasun ${guest},\n\nTanpa mengurangi rasa hormat, kami mengundang Bapak/Ibu/Saudara/i untuk hadir di acara pernikahan kami.\n\nDetail undangan dapat dilihat melalui link berikut:\n${generatedUrl}\n\nHatur Nuhun.`;
            waBtn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(waMessage)}`;
        });

        function copyLink() {
            const textToCopy = linkOutput.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Link undangan berhasil disalin!');
            });
        }
    </script>
</body>
</html>
